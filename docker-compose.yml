services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: yunojuno
      POSTGRES_USER: yunojuno
      POSTGRES_PASSWORD: yunojuno
    ports:
      # Consider e.g. 5433:5432 (and set DB_PORT=5433) so it does not map to
      # default port used by a potential Postgres process running on the host.
      - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
